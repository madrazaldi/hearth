[package]
name = "hearth-core"
description = "Hearth's IRC engine: connections, storage and the command API shared by every frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hearth_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.23"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10.9"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
rcgen = "0.14.7"
getrandom = "0.4.3"
url = "2.5.8"
imagesize = { version = "0.15", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
