[package]
name = "hearth-ffi"
description = "C ABI over hearth-core, linked by the native macOS app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "hearth_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
hearth-core = { path = "../hearth-core" }
serde_json = "1"
log = "0.4"
