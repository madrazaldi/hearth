name: Release

# Runs CI, then builds the app for macOS (Apple silicon and Intel), Linux and
# Windows into a draft GitHub Release. The release notes are generated from the
# commits since the previous tag (cliff.toml). Publish the draft to ship it:
# the in-app updater reads releases/latest/download/latest.json, which never
# points at a draft.
#
# Installers are built by cargo-packager (config: [package.metadata.packager] in
# crates/hearth-app/Cargo.toml) and renamed by `cargo xtask stage`.
#
# Everything below is opt-in per secret group, so forks and fresh clones still
# get (unsigned, non-updating) builds:
#
#   macOS sign:      MACOS_CERTIFICATE (base64 .p12), MACOS_CERTIFICATE_PASSWORD,
#                    MACOS_DEVELOPER_ID (the identity name)
#   macOS notarize:  MACOS_APPLE_ID, MACOS_APPLE_PASSWORD (app-specific), MACOS_TEAM_ID
#   updates:         UPDATER_PRIVATE_KEY (+ UPDATER_PRIVATE_KEY_PASSWORD) from
#                    `cargo packager signer generate`, and UPDATER_PUBKEY, its public
#                    half, which is compiled into the app. Without them nothing is
#                    signed, latest.json is not published, and the app never updates.
#
# The ELECTROBUN_* names the macOS secrets had before are still read.
# Windows and Linux builds are not code-signed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  create-release:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # A tag run takes that tag's commits; a manual run takes everything since the last tag.
          args: ${{ github.ref_type == 'tag' && '--current' || '--unreleased' }} --strip all
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo xtask version)
          tag="v$version"
          # Fails if a crate or Cargo.lock disagrees with the workspace version, or the tag with it.
          if [ "$REF_TYPE" = tag ]; then
            cargo xtask check-version "$REF_NAME"
          else
            cargo xtask check-version
          fi
          # A manual run builds $GITHUB_SHA, so an existing tag elsewhere would
          # leave the assets and the tag disagreeing.
          if [ "$REF_TYPE" != tag ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists; run the workflow from the tag instead"
            exit 1
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id")
          if [ -n "$existing" ]; then
            echo "::error::A release for $tag already exists; delete the draft to rebuild it"
            exit 1
          fi
          cat CHANGES.md - > notes.md <<EOF

          ### Install

          - **macOS:** \`hearth-$version-macos-aarch64.dmg\` (Apple silicon) or \`hearth-$version-macos-x86_64.dmg\` (Intel). Builds that are not notarized need right-click → Open on first launch, or \`xattr -dr com.apple.quarantine /Applications/Hearth.app\`.
          - **Windows:** \`hearth-$version-windows-x86_64-setup.exe\`.
          - **Linux:** \`hearth-$version-linux-x86_64.AppImage\` (updates itself) or \`hearth-$version-linux-x86_64.deb\` (updates with your package manager).

          Installed copies of the macOS app, the Windows installer and the AppImage update themselves from Settings › General.
          EOF
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="Hearth $version" \
            -F body=@notes.md -F draft=true >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `target` is the updater's <os>-<arch> key. Each runner builds for its own architecture.
          - { os: macos-latest, target: macos-aarch64, formats: 'app,dmg' }
          - { os: macos-15-intel, target: macos-x86_64, formats: 'app,dmg' }
          - { os: ubuntu-22.04, target: linux-x86_64, formats: 'appimage,deb' }
          - { os: windows-latest, target: windows-x86_64, formats: 'nsis' }
    runs-on: ${{ matrix.os }}
    env:
      # Keep in step with minimum-system-version in the packager config.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh packaging

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-packager
        id: packager
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-packager${{ runner.os == 'Windows' && '.exe' || '' }}
          key: cargo-packager-${{ matrix.os }}-${{ env.CARGO_PACKAGER_VERSION }}
      - name: Install cargo-packager
        if: steps.packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version ${{ env.CARGO_PACKAGER_VERSION }}

      # Secrets that are unset expand to empty strings, and a present-but-empty
      # variable would turn signing on, so export only the groups that are complete.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE || secrets.ELECTROBUN_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.ELECTROBUN_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID || secrets.ELECTROBUN_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID || secrets.ELECTROBUN_APPLEID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_APPLE_PASSWORD || secrets.ELECTROBUN_APPLEIDPASS }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID || secrets.ELECTROBUN_TEAMID }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$DEVELOPER_ID" ]; then
            # cargo-packager imports the certificate into a temporary keychain itself.
            {
              echo "APPLE_CERTIFICATE=$CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            } >> "$GITHUB_ENV"
            # The identity is only configurable in the manifest, so add it for this build.
            perl -0pi -e 's/(\[package\.metadata\.packager\.macos\]\n)/$1signing-identity = "$ENV{DEVELOPER_ID}"\n/' crates/hearth-app/Cargo.toml
            grep -q '^signing-identity' crates/hearth-app/Cargo.toml || { echo "::error::could not set the signing identity"; exit 1; }
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$TEAM_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$TEAM_ID"
              } >> "$GITHUB_ENV"
            else
              echo "::warning::Apple notarization secrets not set: signing without notarizing"
            fi
          else
            echo "::warning::Apple signing secrets not set: building an unsigned app"
          fi

      - name: Configure update signing
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
          PUBLIC_KEY: ${{ secrets.UPDATER_PUBKEY }}
        run: |
          if [ -n "$PRIVATE_KEY" ] && [ -n "$PUBLIC_KEY" ]; then
            {
              echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY=$PRIVATE_KEY"
              echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD=$PRIVATE_KEY_PASSWORD"
              # Compiled into the app: it only installs updates signed by the matching private key.
              echo "HEARTH_UPDATER_PUBKEY=$PUBLIC_KEY"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Updater signing secrets not set: this build will not update itself"
          fi

      - name: Build
        run: cargo build --release --locked -p hearth-app

      - name: Package
        run: cargo packager --release -p hearth-app -f ${{ matrix.formats }}

      - name: Stage release assets
        run: cargo xtask stage --target ${{ matrix.target }} --from target/release --to staged --repo ${{ github.repository }}

      # Finds the draft created above by its tag and adds the files to it.
      - name: Upload to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          # The installers and their signatures; the update fragments go to the manifest job.
          files: staged/hearth-*

      - name: Keep the updater fragment
        uses: actions/upload-artifact@v7
        with:
          name: update-${{ matrix.target }}
          path: staged/update-*.json
          if-no-files-found: ignore

  # One latest.json for every platform, once they are all built.
  updater-manifest:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          pattern: update-*
          path: fragments
          merge-multiple: true
      - name: Publish latest.json to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          if ! ls fragments/update-*.json >/dev/null 2>&1; then
            echo "::warning::No signed builds, so no latest.json: installed copies will not be offered this release"
            exit 0
          fi
          # The notes are the generated ones, without the install instructions.
          gh release view "$TAG" --json body --jq .body | awk '/^### Install/ { exit } { print }' > notes.md
          cargo xtask manifest --notes notes.md --out latest.json fragments/update-*.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
