name: Release

# Runs CI, then builds Electrobun apps (bundled Chromium) for macOS, Linux and
# Windows into a draft GitHub Release. The release notes are generated from the
# commits since the previous tag (cliff.toml). Publish the draft to ship it:
# the in-app updater reads releases/latest/download, which never points at a
# draft.
#
# The updater needs the flat files Electrobun writes to artifacts/ (the
# `<channel>-<os>-<arch>-update.json` and the archive next to it), uploaded
# without renaming; they are attached alongside the installers.
#
# macOS signing is opt-in per secret group, so forks and fresh clones still get
# (unsigned) builds:
#   sign:      ELECTROBUN_CERTIFICATE (base64 .p12), ELECTROBUN_CERTIFICATE_PASSWORD,
#              ELECTROBUN_DEVELOPER_ID (the identity name)
#   notarize:  ELECTROBUN_APPLEID, ELECTROBUN_APPLEIDPASS, ELECTROBUN_TEAMID
# Windows and Linux builds are not signed (Electrobun has no signing step for them).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  create-release:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # A tag run takes that tag's commits; a manual run takes everything since the last tag.
          args: ${{ github.ref_type == 'tag' && '--current' || '--unreleased' }} --strip all
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(bun scripts/version.mjs)
          tag="v$version"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag $REF_NAME does not match version $version in electrobun.config.ts"
            exit 1
          fi
          # A manual run builds $GITHUB_SHA, so an existing tag elsewhere would
          # leave the assets and the tag disagreeing.
          if [ "$REF_TYPE" != tag ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists; run the workflow from the tag instead"
            exit 1
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id")
          if [ -n "$existing" ]; then
            echo "::error::A release for $tag already exists; delete the draft to rebuild it"
            exit 1
          fi
          cat CHANGES.md - > notes.md <<'EOF'

          ### Install

          - **macOS:** `macos-arm64-Hearth.dmg` (Apple silicon) or `macos-x64-Hearth.dmg` (Intel). Builds that are not notarized need right-click → Open on first launch, or `xattr -dr com.apple.quarantine /Applications/Hearth.app`.
          - **Windows:** `win-x64-Hearth-Setup.zip`.
          - **Linux:** `linux-x64-Hearth-Setup.tar.gz`.

          Installed copies update themselves from Settings › General.
          EOF
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="Hearth $version" \
            -F body=@notes.md -F draft=true >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # Electrobun builds for the architecture of the machine it runs on.
        os: [macos-latest, macos-15-intel, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libnss3 libasound2

      - uses: oven-sh/setup-bun@v2
      # Runs `electrobun prepare` through the `prepare` hook, which projects the SDK.
      - run: bun install --frozen-lockfile

      # Secrets that are unset expand to empty strings, and a present-but-empty
      # variable would turn signing on, so export only the groups that are complete.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.ELECTROBUN_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.ELECTROBUN_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
          APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
          TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$DEVELOPER_ID" ]; then
            keychain="$RUNNER_TEMP/build.keychain-db"
            pass=$(uuidgen)
            security create-keychain -p "$pass" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$pass" "$keychain"
            echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            echo "ELECTROBUN_DEVELOPER_ID=$DEVELOPER_ID" >> "$GITHUB_ENV"
            if [ -n "$APPLEID" ] && [ -n "$APPLEIDPASS" ] && [ -n "$TEAMID" ]; then
              echo "ELECTROBUN_APPLEID=$APPLEID" >> "$GITHUB_ENV"
              echo "ELECTROBUN_APPLEIDPASS=$APPLEIDPASS" >> "$GITHUB_ENV"
              echo "ELECTROBUN_TEAMID=$TEAMID" >> "$GITHUB_ENV"
            else
              echo "::warning::Apple notarization secrets not set: signing without notarizing"
            fi
          else
            echo "::warning::Apple signing secrets not set: building an unsigned app"
          fi

      - name: Build
        run: bun run build

      # Finds the draft created above by its tag and adds the files to it.
      - name: Upload to the draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          files: artifacts/*
