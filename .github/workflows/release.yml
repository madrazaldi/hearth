name: Release

# Runs CI, then builds installers for Windows, Linux and macOS into a draft
# GitHub Release, together with the updater's latest.json. The release notes
# are generated from the commits since the previous tag (cliff.toml).
# Publish the draft to ship it: the in-app
# updater reads releases/latest, which never points at a draft.
#
# Signing is opt-in per secret group, so forks and fresh clones still get
# (unsigned) builds:
#   updater:  TAURI_SIGNING_PRIVATE_KEY [+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD]
#   Windows:  WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   macOS:    APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#             APPLE_SIGNING_IDENTITY [+ APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID to notarize]

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  create-release:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # A tag run takes that tag's commits; a manual run takes everything since the last tag.
          args: ${{ github.ref_type == 'tag' && '--current' || '--unreleased' }} --strip all
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag $REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi
          # A manual run builds $GITHUB_SHA, so an existing tag elsewhere would
          # leave the assets and the tag disagreeing.
          if [ "$REF_TYPE" != tag ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists; run the workflow from the tag instead"
            exit 1
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id")
          if [ -n "$existing" ]; then
            echo "::error::A release for $tag already exists; delete the draft to rebuild it"
            exit 1
          fi
          cat CHANGES.md - > notes.md <<'EOF'

          ### Install

          - **Windows:** the `.msi` or `-setup.exe` installer.
          - **macOS:** the universal `.dmg` (Apple silicon and Intel). Builds that are not notarized need right-click → Open on first launch, or `xattr -dr com.apple.quarantine /Applications/Hearth.app`.
          - **Linux:** the `.AppImage`, `.deb` or `.rpm`.

          Installed copies update themselves from Settings › General.
          EOF
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="Hearth $version" \
            -F body=@notes.md -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner, so the AppImage and .deb link against an older glibc.
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
          # One universal bundle for Apple silicon and Intel; the updater serves it to both.
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile

      # Secrets that are unset expand to empty strings, and the Tauri bundler
      # treats an empty-but-present variable as "sign with this", so only export
      # the groups that are complete.
      - name: Configure signing
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          put() {
            local d="EOF_$RANDOM$RANDOM"
            { echo "$1<<$d"; printf '%s\n' "$2"; echo "$d"; } >> "$GITHUB_ENV"
          }

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            put TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            put TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: building without updater artifacts"
            # Without the key the bundler refuses to build updater artifacts at all.
            bun -e 'const f="src-tauri/tauri.conf.json",fs=require("fs"),c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2))'
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$RUNNER_OS" = Windows ]; then
            if [ -n "$WINDOWS_CERTIFICATE" ]; then
              echo "wincert=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Windows signing secrets not set: building unsigned installers"
            fi
          fi

          # tauri-action signs, and notarizes, when these are in the environment.
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
              put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
              put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
              put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
              if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                put APPLE_ID "$APPLE_ID"
                put APPLE_PASSWORD "$APPLE_PASSWORD"
                put APPLE_TEAM_ID "$APPLE_TEAM_ID"
              else
                echo "::warning::Apple notarization secrets not set: signing without notarizing"
              fi
            else
              echo "::warning::Apple signing secrets not set: building an unsigned app"
            fi
          fi

      - name: Import Windows certificate
        if: steps.signing.outputs.wincert == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          # Merged over tauri.conf.json automatically on Windows builds.
          @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5 | Set-Content src-tauri/tauri.windows.conf.json

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: ${{ steps.signing.outputs.updater == 'true' }}
