name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check versions agree
        run: bun scripts/version.mjs
      # Type-checks the UI and the Bun side, then runs Vitest and `bun test`.
      - run: bun run check
      - run: bun run test

  # The IRC engine runs on Bun in the app's main process: its tests exercise
  # real sockets, TLS and the OS keychain bindings, so run them everywhere the app ships.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The engine needs no Electrobun SDK, so skip the `prepare` hook that downloads it.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test src/bun
