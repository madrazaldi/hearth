name: Bug report
description: Something in Hearth doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hearth version
      description: Shown at the bottom of Settings.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server or bouncer
      description: For example Libera.Chat, OFTC, or soju. Leave out passwords and private hostnames.
  - type: textarea
    id: logs
    attributes:
      label: Logs or raw IRC lines
      description: Anything relevant. Remove passwords, tokens and SASL exchanges first.
      render: text
