# Monthly, grouped so a month's routine bumps arrive as one PR per ecosystem.
# gpui-kit (and with it gpui-pre) is pinned exactly in crates/hearth-app/Cargo.toml:
# bump it by hand, since each release can need changes in the UI code.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
