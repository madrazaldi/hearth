# Monthly, grouped so a month's routine bumps arrive as one PR per ecosystem.
# electrobun is pinned exactly: its version also selects the runtime and SDK
# that `electrobun prepare` projects, so bump it by hand and rebuild.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: electrobun
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
