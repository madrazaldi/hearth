[package]
name = "hearth"
version = "0.1.0"
description = "A modern IRC client"
edition = "2021"
rust-version = "1.90"

[lib]
name = "hearth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# `tauri build` fails unless these match the npm packages' minor versions.
tauri-plugin-process = "~2.3"
tauri-plugin-updater = "~2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10.9"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
rcgen = "0.14.7"
getrandom = "0.3.4"
url = "2.5.8"
