[package]
name = "hearth"
description = "A modern IRC client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hearth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hearth-core = { path = "../crates/hearth-core" }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# `tauri build` fails unless these match the npm packages' minor versions.
tauri-plugin-process = "~2.3"
tauri-plugin-updater = "~2.12"
serde_json = "1"
log = "0.4"
